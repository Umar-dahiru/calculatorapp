<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="A clean, responsive calculator for everyday calculations.">
  <title>Calculator App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Calculator home"><span class="brand-mark">÷</span><span>calc<span class="brand-accent">.</span></span></a>
      <span class="topbar-label">SIMPLE. SMART. PRECISE.</span>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="calculator-heading">
        <div><p class="eyebrow">EVERYDAY TOOL</p><h1>Calculator</h1></div>
        <span class="status-dot" title="Ready"></span>
      </div>

      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression"></div>
        <output class="result" id="display">0</output>
      </div>

      <div class="keypad" id="keypad">
        <button class="key key-muted" data-action="clear">AC</button>
        <button class="key key-muted" data-action="delete" aria-label="Delete last digit">⌫</button>
        <button class="key key-operator" data-value="%">%</button>
        <button class="key key-operator" data-value="÷">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key-operator" data-value="×">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key-operator" data-value="−">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key-operator" data-value="+">+</button>

        <button class="key key-zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>
      <p class="hint">Tip: You can also use your keyboard.</p>
    </section>
    <footer>Built with care <span>·</span> Calculator App</footer>
  </main>
</body>
</html>
